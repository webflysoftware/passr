name: List prod images (diagnostic)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: List images and will article on production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER || 'root' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            echo "=== /var/www/passr.net/images ==="
            ls -la /var/www/passr.net/images/ || true
            echo "=== will-related files ==="
            find /var/www/passr.net -iname '*will*' -o -iname '*confused*' -o -iname '*legal*' 2>/dev/null | head -100
            echo "=== article dir ==="
            ls -la /var/www/passr.net/article/using-llms-to-build-a-legal-will/ 2>/dev/null || ls -la /var/www/passr.net/article/ | head -50
            echo "=== file ==="
            file /var/www/passr.net/images/will-builder-confused.jpg 2>/dev/null || echo "missing will-builder-confused.jpg"
            file /var/www/passr.net/images/using-llms-to-build-a-legal-will.jpg 2>/dev/null || echo "missing using-llms-to-build-a-legal-will.jpg"
